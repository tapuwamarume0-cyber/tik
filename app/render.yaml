services:
  - type: web
    name: booster-backend
    runtime: python
    buildCommand: pip install -r requirements.txt && playwright install chromium
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: MAX_DAILY_ACTIONS
        value: 35
      - key: MIN_DELAY
        value: 120
      - key: MAX_DELAY
        value: 480